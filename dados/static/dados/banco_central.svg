    <rect x="11.5" y="7.5" width="9" height="1.3"/>
    <rect x="11.5" y="10.5" width="9" height="1.3"/>
    <rect x="11.5" y="13.5" width="9" height="1.3"/>
    <rect x="11.5" y="16.5" width="9" height="1.3"/>
    <rect x="11.5" y="19.5" width="9" height="1.3"/>
    <rect x="5.5" y="25.3" width="21" height="1.3"/>
    <rect x="5.5" y="28" width="21" height="1.3"/>
